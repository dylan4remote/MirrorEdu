<!DOCTYPE html>
<meta charset="UTF-8" />
<title>MirrorEdu - Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />

<div id="intro" class="intro">
  <div class="intro-mark">MirrorEdu</div>
  <div class="intro-track"><div class="intro-fill"></div></div>
</div>

<div class="auth-wrap">
  <div class="auth-grid">
    <div class="auth-hero">
      <span class="auth-kicker">// study, out loud</span>
      <h1 class="auth-headline">Think out loud.<br />We'll keep up.</h1>
      <p class="auth-lede">
        Your personal study companion - built for calculus, psychology, and
        everything in between.
      </p>
    </div>

    <div class="auth-card">
      <div class="brand">MirrorEdu</div>
      <div class="brand-sub">Your personal AI chat</div>

      <div class="tabs">
        <button class="tab-btn active" data-mode="signin">Sign In</button>
        <button class="tab-btn" data-mode="signup">Sign Up</button>
      </div>

      <div id="error-box" class="error-box"></div>

      <form id="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required minlength="6" />
        </div>
        <button type="submit" class="btn" id="submit-btn">Sign In</button>
      </form>

      <div class="divider">or</div>

      <button id="google-btn" class="btn btn-secondary">Continue with Google</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/intro.js"></script>
<script src="js/auth.js"></script>
