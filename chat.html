<!DOCTYPE html>
<meta charset="UTF-8" />
<title>MirrorEdu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand">MirrorEdu</div>
      <button id="new-chat-btn" class="new-chat-btn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>New chat</span>
      </button>
    </div>
    <div class="sidebar-block-label">Threads</div>
    <div id="conversation-list" class="conversation-list"></div>
    <div class="sidebar-footer">
      <span id="user-email" class="user-email"></span>
      <button id="sign-out-btn" class="sign-out-btn">Sign out</button>
    </div>
  </div>

  <div class="chat-main">
    <div class="chat-header">
      <span id="chat-title" class="chat-title">MirrorEdu</span>
    </div>

    <div id="banner" class="banner"></div>

    <div id="message-list" class="message-list">
      <div id="message-list-inner" class="message-list-inner">
        <div class="empty-state">
          <span class="empty-kicker">// start here</span>
          <h2 class="empty-headline">What are we studying today?</h2>
          <p class="empty-sub">Ask a question, paste your notes, or pick a starting point.</p>
          <div class="suggestion-row">
            <button type="button" class="suggestion-chip" data-prompt="Explain this concept step by step: ">Explain a concept</button>
            <button type="button" class="suggestion-chip" data-prompt="Summarize this into clear bullet points: ">Summarize my notes</button>
            <button type="button" class="suggestion-chip" data-prompt="Walk me through solving this problem: ">Solve a problem</button>
            <button type="button" class="suggestion-chip" data-prompt="Quiz me with a few practice questions on: ">Quiz me</button>
          </div>
        </div>
      </div>

      <button id="scroll-bottom-btn" class="scroll-bottom-btn" aria-label="Scroll to latest message" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 6l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="composer-wrap">
      <div class="composer-stack">
        <div id="attachment-preview" class="attachment-preview" hidden></div>
        <div class="composer">
          <input
            type="file"
            id="attachment-input"
            accept="application/pdf,image/png,image/jpeg,image/webp,image/gif"
            hidden
          />
          <button type="button" id="attach-btn" class="icon-btn" aria-label="Attach a file">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M10.8 4.3L5.6 9.5a2.1 2.1 0 002.9 2.9L14 6.9a3.7 3.7 0 00-5.2-5.2L3.3 7.2a5.3 5.3 0 007.5 7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Message MirrorEdu..."></textarea>
          <button id="send-btn" class="send-btn" aria-label="Send message" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/chat.js"></script>
