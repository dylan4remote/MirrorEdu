<title>MirrorEdu</title>
<link rel="stylesheet" href="styles.css" />

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand">MirrorEdu</div>
      <button id="new-chat-btn" class="new-chat-btn">+ New chat</button>
    </div>
    <div id="conversation-list" class="conversation-list"></div>
    <div class="sidebar-footer">
      <span id="user-email" class="user-email"></span>
      <button id="sign-out-btn" class="sign-out-btn">Sign out</button>
    </div>
  </div>

  <div class="chat-main">
    <div id="banner" class="banner"></div>

    <div id="message-list" class="message-list">
      <div id="message-list-inner" class="message-list-inner">
        <div class="empty-state">Start a new conversation below.</div>
      </div>

      <button id="scroll-bottom-btn" class="scroll-bottom-btn" aria-label="Scroll to latest message" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 6l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message MirrorEdu..."></textarea>
        <button id="send-btn" class="send-btn" aria-label="Send message" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/chat.js"></script>
